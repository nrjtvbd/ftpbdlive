name: Update YouTube Stream Link

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

# ঠিক এই জায়গায় নিচের ২ লাইন যুক্ত করুন
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Run script
        run: python main.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add yt_link.txt
          git commit -m "Update live link" || exit 0
          git push
